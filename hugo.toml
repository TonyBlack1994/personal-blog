baseURL = "https://luxseen.com/"

languageCode = "zh-cn"

title = "Luxseen"

theme = "PaperMod"


enableRobotsTXT = true



# =====================================
# 分类系统
# =====================================

[taxonomies]

category = "categories"

tag = "tags"

subcategory = "subcategories"



# =====================================
# 分页
# =====================================

[pagination]

pagerSize = 10



# =====================================
# 网站输出
# =====================================

[outputs]

home = [
    "HTML",
    "RSS",
    "JSON"
]



# =====================================
# 网站参数
# =====================================

[params]


author = "Tony"


description = "Luxseen 是一个记录 DTC 独立站运营、Shopify、AI工具、数据分析、全球消费趋势与个人成长的个人博客。"


defaultTheme = "auto"



# 阅读体验

ShowReadingTime = true

ShowShareButtons = true

ShowPostNavLinks = true

ShowBreadCrumbs = true

ShowCodeCopyButtons = true

ShowToc = true



# 首页文章数量

mainSections = [
    "posts"
]



# =====================================
# 顶部 Logo
# =====================================

[params.label]

text = "Luxseen"

icon = "/images/luxseen-logo.png"

iconHeight = 35

iconWidth = 35



# =====================================
# 网站图标
# =====================================

[params.assets]

favicon = "/images/luxseen-logo.png"

favicon16x16 = "/images/luxseen-logo.png"

favicon32x32 = "/images/luxseen-logo.png"

apple_touch_icon = "/images/luxseen-logo.png"



# =====================================
# 首页
# =====================================

[params.homeInfoParams]


Title = "你好，欢迎来到 Luxseen 👋"


Content = """

记录实践，沉淀方法。


这里记录：

- DTC 独立站运营
- Shopify 实践
- AI 工具应用
- 数据分析
- 全球消费趋势
- 阅读与个人成长


把经历变成经验，
把经验沉淀成方法。

"""



# =====================================
# 搜索
# =====================================

[params.fuseOpts]

isCaseSensitive = false

shouldSort = true

location = 0

distance = 1000

threshold = 0.4

minMatchCharLength = 2

keys = [
    "title",
    "permalink",
    "summary",
    "content"
]



# =====================================
# 顶部导航
# =====================================


[[menu.main]]

identifier = "home"

name = "首页"

url = "/"

weight = 1



[[menu.main]]

identifier = "dtc"

name = "DTC运营"

url = "/categories/dtc/"

weight = 10



[[menu.main]]

identifier = "about"

name = "自我简介"

url = "/about/"

weight = 20



[[menu.main]]

identifier = "global-buy"

name = "环球代购"

url = "/global-buy/"

weight = 30



[[menu.main]]

identifier = "tags"

name = "标签"

url = "/tags/"

weight = 40



[[menu.main]]

identifier = "search"

name = "搜索"

url = "/search/"

weight = 50



# =====================================
# Markdown 渲染
# =====================================

[markup]


[markup.goldmark]


[markup.goldmark.renderer]

unsafe = true



[markup.highlight]

noClasses = false

lineNos = true

codeFences = true